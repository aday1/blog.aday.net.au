name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static blog
        run: node ./scripts/build-blog.mjs
      - name: Skip notice when token is missing
        if: ${{ env.CF_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not configured. Skipping Cloudflare deploy."
      - name: Deploy via Wrangler
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          command: deploy --override-existing-dns-record
          apiToken: ${{ env.CF_API_TOKEN }}
