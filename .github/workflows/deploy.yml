name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static blog
        run: node ./scripts/build-blog.mjs

      - name: Write deploy metadata
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-12)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p public/data
          cat > public/data/deploy-meta.json <<EOF
          {
            "site": "blog.aday.net.au",
            "branch": "${GITHUB_REF_NAME}",
            "track": "${GITHUB_REF_NAME}",
            "version": "${SHORT_SHA}",
            "build_date": "${BUILD_DATE}",
            "last_git_sha_short": "${SHORT_SHA}",
            "last_git_sha": "${GITHUB_SHA}",
            "last_git_url": "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}",
            "last_build_at": "${BUILD_DATE}",
            "last_deployed_at": "${BUILD_DATE}",
            "changelog_url": "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}",
            "commits_history_url": "https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}",
            "changelog_md_url": "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md",
            "releases_url": "https://github.com/${GITHUB_REPOSITORY}/releases",
            "workflow_run_url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF
          node -e "const fs=require('node:fs');const path='public/index.html';const html=fs.readFileSync(path,'utf8');const payload={site:'blog.aday.net.au',branch:'${GITHUB_REF_NAME}',track:'${GITHUB_REF_NAME}',version:'${SHORT_SHA}',build_date:'${BUILD_DATE}',last_git_sha_short:'${SHORT_SHA}',last_git_sha:'${GITHUB_SHA}',last_git_url:'https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}',last_build_at:'${BUILD_DATE}',last_deployed_at:'${BUILD_DATE}',changelog_url:'https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}',commits_history_url:'https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}',changelog_md_url:'https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md',releases_url:'https://github.com/${GITHUB_REPOSITORY}/releases',workflow_run_url:'https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}',run_id:'${GITHUB_RUN_ID}',run_number:'${GITHUB_RUN_NUMBER}'};const tag='<script>window.__DEPLOY_META__='+JSON.stringify(payload)+'</script>';fs.writeFileSync(path,html.replace('</body>',tag+'</body>'));"
      - name: Skip notice when token is missing
        if: ${{ env.CF_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not configured. Skipping Cloudflare deploy."
      - name: Deploy via Wrangler
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ env.CF_API_TOKEN }}
