name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static blog
        run: node ./scripts/build-blog.mjs

      - name: Write deploy metadata
        run: |
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-12)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p public/data
          cat > public/data/deploy-meta.json <<EOF
          {
            "site": "blog.aday.net.au",
            "branch": "${GITHUB_REF_NAME}",
            "track": "${GITHUB_REF_NAME}",
            "version": "${SHORT_SHA}",
            "build_date": "${BUILD_DATE}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF
      - name: Skip notice when token is missing
        if: ${{ env.CF_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not configured. Skipping Cloudflare deploy."
      - name: Deploy via Wrangler
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4"
          apiToken: ${{ env.CF_API_TOKEN }}
